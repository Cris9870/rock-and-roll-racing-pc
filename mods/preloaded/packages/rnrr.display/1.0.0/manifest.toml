format_version = 1
id = "rnrr.display"
version = "1.0.0"
name = "Rock N' Roll Racing Display Enhancements"
author = "RockNRollRacingSNESRecomp"
description = "True widescreen races and motion interpolation (European and USA revisions)."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "rocknrollracing"
rom_sha256 = "94d761a7339804271bf77d541f46a1d211918336ce741b561bfc3ddcaca98ec7"

[[target]]
game_id = "rocknrollracing"
rom_sha256 = "9d721753301278325c851f1843d669a697aed757dcf6495a31fc31ddf664b182"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Widens the race view. Menus and the title stay 4:3 and are pillarboxed."
group = "Display"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "rnrr.widescreen"

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[option.choice]]
value = "fit"
label = "Fit window"

[[feature]]
id = "presentation-fps"
name = "Motion interpolation"
description = "Presents at the display refresh (or a fixed rate) and blends background scrolling and car motion between the game's logic updates, so 30 updates per second look smooth at 120 Hz. Adds 1 frame of display delay, since a game frame is shown only once the next one is known."
group = "Display"
default_enabled = true

[[plugin]]
feature = "presentation-fps"
id = "rnrr.presentation-fps"

[[option]]
feature = "presentation-fps"
id = "rate"
label = "Rate"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "Display refresh"

[[option.choice]]
value = "90"
label = "90"

[[option.choice]]
value = "120"
label = "120"

[[option.choice]]
value = "144"
label = "144"

[[option.choice]]
value = "165"
label = "165"

[[option.choice]]
value = "240"
label = "240"

[[option.choice]]
value = "360"
label = "360"

[[feature]]
id = "overclock"
name = "CPU overclock"
description = "Gives the game more CPU time per frame during races so its logic never overruns a frame. Auto is 150% with the 30 FPS feature on, 100% with it off."
group = "Display"
default_enabled = true

[[plugin]]
feature = "overclock"
id = "rnrr.overclock"

[[option]]
feature = "overclock"
id = "percent"
label = "CPU speed"
type = "choice"
default = "auto"

[[option.choice]]
value = "auto"
label = "Auto"

[[option.choice]]
value = "100"
label = "100% (stock)"

[[option.choice]]
value = "125"
label = "125%"

[[option.choice]]
value = "150"
label = "150%"

[[option.choice]]
value = "200"
label = "200%"
